name: Release

# 打 v* 标签（如 v0.1.0）时构建插件包、发布 GitHub Release 并（幂等地）发布 npm。
# npm 发布走 OIDC Trusted Publishing（无静态 token / 无 OTP，Node 24 自带 npm 11）。
# 需先在 npmjs.com 包设置里配置 trusted publisher：
#   repo = MoonlitDropOfBlood/dsh-deveco，workflow = .github/workflows/release.yml
# 已存在于 npm 的版本会跳过 publish（首版可先用本机 token 发布 bootstrap，
# 之后的 v* 标签全自动）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Check, test & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check + Test
        run: npm run check && npm test

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./*.tgz

  publish-npm:
    name: Publish to npm (Trusted Publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - name: Skip when this version is already on npm
        id: check
        run: |
          PKG=$(node -p "require('./package.json').name + '@' + require('./package.json').version")
          if npm view "$PKG" version --registry=https://registry.npmjs.org 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.exists == 'false'
        run: npm publish

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }}

            dsh-deveco — DSH 的 HarmonyOS 全栈开发套件。

            ### 功能
            - 官方右侧边栏两个 Tab：**HiLog 检查器**（实时流 + 级别/包名/关键词过滤）、**ArkUI Inspector**（Chrome Elements 风格：截图点选高亮 + 可折叠组件树 + 节点属性搜索 + 盒子模型）
            - **两套 UI 树源**：DevEco 调试源（反编译复刻 DevEco Studio 同款 `ark:<pid>@<pkg>` 调试链路，**唯一带 padding/margin/border 声明值与自定义组件名**）/ uitest 无障碍树（适合已发布应用）
            - **`harmony_ui_tree` agent 工具**（`ctx.tools`）：对话里的 agent 直接取 ArkUI 组件树
            - **.ets 文件查看器**：ArkTS 语法高亮（方法/类型/装饰器/声明式 UI 组件着色，对标 DevEco Studio）
            - 设置页 → HarmonyOS Suite：DevEco Studio / Command Line Tools 路径管理（三平台自发现 + 互斥）+ 设备管理（USB / 网络 `hdc tconn`）
            - 21 个 Remote 方法 · 82 个单元测试

            ### 📦 安装
            ```bash
            dsh plugin --profile web add @duke-dsh-plugins/dsh-deveco
            ```
            或使用本 Release 附件中的 tgz 包安装。装完**必须重启 DSH** 生效。
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}